name: BetterElearning engine

# 給每個使用者自己的私有 repo 呼叫 (reusable workflow)：
#   jobs:
#     sync:
#       uses: gtoki3177/BetterNDHUelearning/.github/workflows/engine-sync.yml@v1
#       with: { engine_ref: v1, firebase_uid: ${{ vars.FIREBASE_UID }}, dept_label: ..., dept_pattern: ... }
#       secrets:                # 一個一個明確傳：別的帳號的 repo 用 secrets: inherit 傳不過來 (只限同一個帳號或組織)
#         MOODLE_USERNAME: ${{ secrets.MOODLE_USERNAME }}   … 下面 secrets: 列的每一個都照這樣寫
# engine_ref 要跟 uses 後面的 @ 一樣，engine/ 的程式才會跟 workflow 同一個版本。
on:
  workflow_call:
    inputs:
      firebase_uid:
        type: string
        required: true
      dept_label:
        type: string
        default: "系上"
      dept_pattern:
        type: string
        default: "系辦"
      engine_ref:
        description: "用哪個版本的 engine/：跟 uses 後面的 @ 一樣 (v1 / main / commit SHA)"
        type: string
        default: "v1"
      mail_month:
        description: "補抓某個月的信 (YYYY-MM，app 的「載入更早的信」)；空白 = 一般同步"
        type: string
        default: ""
      submit_id:
        description: "代交作業 (app 送來的 submit 文件 id)；空白 = 一般同步"
        type: string
        default: ""
    secrets:
      MOODLE_USERNAME:
        required: false
      MOODLE_PASSWORD:
        required: false
      MAIL_APP_PASSWORD:        # 選用：沒設就不同步信箱
        required: false
      FIREBASE_SA:
        required: false
      SUMMARY_PROVIDER:         # 選用：信件摘要
        required: false
      SUMMARY_BASE_URL:
        required: false
      SUMMARY_MODEL:
        required: false
      SUMMARY_API_KEY:
        required: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: betterel-sync-${{ github.repository }}
      cancel-in-progress: false
    env:
      TZ: Asia/Taipei
    steps:
      - name: Get engine
        uses: actions/checkout@v4
        with:
          repository: gtoki3177/BetterNDHUelearning
          ref: ${{ inputs.engine_ref }}
          sparse-checkout: engine
          path: src

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: src/engine/requirements.txt

      - name: Install deps
        run: pip install -q -r src/engine/requirements.txt

      - name: Write config.ini
        working-directory: src/engine
        env:
          MOODLE_USERNAME: ${{ secrets.MOODLE_USERNAME }}
          DEPT_LABEL: ${{ inputs.dept_label }}
          DEPT_PATTERN: ${{ inputs.dept_pattern }}
        run: |
          if [ -z "$MOODLE_USERNAME" ]; then echo "secret MOODLE_USERNAME 沒設"; exit 1; fi
          python3 - <<'PY'
          import os
          s = open("config.cloud.ini", encoding="utf-8").read()
          for k in ("USERNAME", "DEPT_LABEL", "DEPT_PATTERN"):
              s = s.replace(f"__{k}__", os.environ["MOODLE_USERNAME" if k == "USERNAME" else k])
          open("config.ini", "w", encoding="utf-8").write(s)
          PY
          mkdir -p /tmp/betterel_root

      - name: Mail archive (one month)
        if: inputs.mail_month != ''
        working-directory: src/engine
        env:
          MAIL_APP_PASSWORD: ${{ secrets.MAIL_APP_PASSWORD }}
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
          FIREBASE_UID: ${{ inputs.firebase_uid }}
          MAIL_MONTH: ${{ inputs.mail_month }}
        run: |
          if [ -z "$MAIL_APP_PASSWORD" ]; then echo "沒設 MAIL_APP_PASSWORD，沒辦法補抓信件"; exit 1; fi
          python mail_sync.py --month "$MAIL_MONTH"
          python cloud_push.py archive --dir . --month "$MAIL_MONTH"

      - name: Pull previous state from Firestore
        if: inputs.mail_month == ''
        working-directory: src/engine
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
          FIREBASE_UID: ${{ inputs.firebase_uid }}
        run: python cloud_push.py pull --dir .

      - name: Submit assignment
        if: inputs.submit_id != ''
        working-directory: src/engine
        env:
          MOODLE_PASSWORD: ${{ secrets.MOODLE_PASSWORD }}
          MOODLE_COOKIE_FILE: moodle_cookies.json
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
          FIREBASE_UID: ${{ inputs.firebase_uid }}
          SUBMIT_ID: ${{ inputs.submit_id }}
        run: python submit.py --id "$SUBMIT_ID"

      - name: Moodle light sync
        if: inputs.mail_month == '' && inputs.submit_id == ''
        working-directory: src/engine
        env:
          MOODLE_PASSWORD: ${{ secrets.MOODLE_PASSWORD }}
          MOODLE_COOKIE_FILE: moodle_cookies.json
        # 學校擋國外連線時 (GitHub 的機器在國外) 連 e學苑會逾時：不算這次同步失敗 (不然每小時都紅一次)，改成警告；
        # status_moodle.json 還是記著「沒成功」推上雲端，電腦端看到會接手同步。帳密錯之類的其他錯誤照樣失敗。
        run: |
          python moodle_sync.py --light && exit 0
          if grep -qE "ConnectTimeout|ConnectionError|Max retries exceeded|timed out|Connection refused|Network is unreachable" log.txt 2>/dev/null; then
            echo "::warning title=e學苑連不上::學校擋了國外的連線 (GitHub 的機器在國外)，這次 e學苑交給電腦代為同步；信箱照常。"
            exit 0
          fi
          exit 1

      - name: Mail sync
        if: always() && inputs.mail_month == '' && inputs.submit_id == ''
        working-directory: src/engine
        env:
          MAIL_APP_PASSWORD: ${{ secrets.MAIL_APP_PASSWORD }}
        run: |
          if [ -z "$MAIL_APP_PASSWORD" ]; then echo "沒設 MAIL_APP_PASSWORD，略過信箱"; exit 0; fi
          python mail_sync.py

      - name: Push to Firestore
        if: always() && inputs.mail_month == '' && inputs.submit_id == ''
        working-directory: src/engine
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
          FIREBASE_UID: ${{ inputs.firebase_uid }}
        run: python cloud_push.py push --dir . --source actions

      - name: Mail summaries
        # 選用：caller repo 設了 SUMMARY_MODEL (和 SUMMARY_BASE_URL、SUMMARY_API_KEY…) 這幾個 secret 才會跑。
        # 用 OpenAI 相容 API 或 Anthropic API 替需注意的新信寫摘要；失敗不影響同步結果。
        if: always() && inputs.mail_month == '' && inputs.submit_id == ''
        continue-on-error: true
        working-directory: src/engine
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
          FIREBASE_UID: ${{ inputs.firebase_uid }}
          SUMMARY_PROVIDER: ${{ secrets.SUMMARY_PROVIDER }}
          SUMMARY_BASE_URL: ${{ secrets.SUMMARY_BASE_URL }}
          SUMMARY_MODEL: ${{ secrets.SUMMARY_MODEL }}
          SUMMARY_API_KEY: ${{ secrets.SUMMARY_API_KEY }}
        run: |
          if [ -z "$SUMMARY_MODEL" ]; then echo "沒設 SUMMARY_MODEL，略過信件摘要"; exit 0; fi
          if [ "$SUMMARY_PROVIDER" = "anthropic" ]; then pip install -q anthropic; fi
          python summaries.py auto

      - name: Status
        if: always() && inputs.mail_month == '' && inputs.submit_id == ''
        working-directory: src/engine
        run: |
          python3 -c "import json,os;[print(k, {x: json.load(open(f'status_{k}.json', encoding='utf-8')).get(x) for x in ('ok','finished_at','changed')}) for k in ('moodle','mail') if os.path.exists(f'status_{k}.json')]" || true
          tail -n 3 log.txt mail_log.txt 2>/dev/null || true
