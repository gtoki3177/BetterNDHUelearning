# GitHub Actions 用的設定。workflow 會把 __USERNAME__ 換成 secret MOODLE_USERNAME，
# __DEPT_LABEL__ / __DEPT_PATTERN__ 換成 repo 變數 DEPT_LABEL / DEPT_PATTERN (沒設就用「系上」/「系辦」)。
# 雲端只做輕量同步: 不下載教材、不建索引。
[moodle]
username = __USERNAME__
base_url = https://elearn4.ndhu.edu.tw/moodle
root_folder = /tmp/betterel_root
semester = auto
skip_courses =
skip_files =
download_materials = false
build_index = false
max_file_mb = 80
request_delay = 0.6

[mail]
address =
folder = INBOX
imap_host = imap.gmail.com
imap_port = 993
days = 14
limit = 120
include_body = true
body_chars = 1200
unread_only = false
max_fetch_kb = 512
skip_senders =
highlight_keywords = 作業,考試,期中,期末,停課,補課,調課,繳費,註冊,選課,成績,獎學金,實習,面試,截止,逾期,重要,通知
request_delay = 0.1

[dashboard]
dept_label = __DEPT_LABEL__
dept_pattern = __DEPT_PATTERN__
dept_map = CSIE:資訊工程學系, EE:電機工程學系, GC:通識教育中心, XX:通識教育中心, YY:體育中心
noise_senders =
notify = false
