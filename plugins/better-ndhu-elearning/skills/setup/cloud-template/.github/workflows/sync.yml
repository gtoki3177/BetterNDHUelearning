name: cloud-sync

# 每小時第 17 分同步一次 (也可以在 Actions 頁、或 app 的「立即同步」手動觸發)。
# 同步程式在 gtoki3177/BetterNDHUelearning 的 engine/，跟著 v1 版自動更新；密碼放在這個 repo 的 Secrets。
on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

jobs:
  sync:
    uses: gtoki3177/BetterNDHUelearning/.github/workflows/engine-sync.yml@v1
    with:
      firebase_uid: ${{ vars.FIREBASE_UID }}
      dept_label: ${{ vars.DEPT_LABEL || '系上' }}
      dept_pattern: ${{ vars.DEPT_PATTERN || '系辦' }}
    secrets: inherit
