[moodle]
# ---- 你要填的 ----
# gms 帳號, 不用加 @gms.ndhu.edu.tw
username =

# ---- 通常不用動 ----
base_url = https://elearn4.ndhu.edu.tw/moodle

# 科目資料夾放哪 (留空 = _moodle 的上一層)
root_folder =

# 要抓哪個學期。auto = 自動抓選課清單裡最新的那個 (例如 115上)
# 想固定就直接寫 115上 / 114下
semester = auto

# 不想同步的課, 用課號逗號分隔, 例如: XX__10000, YY__10000
skip_courses =

# 不想下載的檔案, 用逗號分隔, 可用萬用字元 * ?
# 比對的是檔名本身 (不含路徑), 不分大小寫。
# 列在這裡的檔案就算本機刪掉也不會再被抓回來。
skip_files =

# 要不要下載教材檔案
download_materials = true

# 每 30 分鐘的輕量同步 (看作業、繳交狀態、行事曆, 不下載)。
# 完整安裝 (BetterElearning app) 這些由雲端同步負責, 設 false: 這台電腦只下載講義和建索引,
# 而且只在雲端同步看到新的講義 / 資料夾 / 作業時才下載 (另外每 7 天完整檢查一次)。
light_sync = true

# 要不要建全文索引 (需要 pdfplumber / python-pptx / python-docx)
build_index = true

# 單檔上限 MB, 超過就跳過 (影片之類的)
max_file_mb = 80

# 每個請求之間停幾秒, 別把學校伺服器當沙包
request_delay = 0.6

[mail]
# ---- 學校信箱 (gms = Gmail) ----
# 完整地址; 留空的話會自動用 [moodle] 的 username + @gms.ndhu.edu.tw
address =

# 要讀哪個信件匣。INBOX = 收件匣
# 想連封存的一起讀可以改成: [Gmail]/All Mail
folder = INBOX

# ---- 通常不用動 ----
imap_host = imap.gmail.com
imap_port = 993

# 往回抓幾天 / 最多幾封
days = 14
limit = 120

# 要不要抓內文 (false 就只留寄件者和主旨), 內文最多留幾個字
include_body = true
body_chars = 1200

# 只抓未讀
unread_only = false

# 超過這個大小的信只抓標頭, 不抓內文 (避免大附件拖慢)
max_fetch_kb = 512

# 不想看到的寄件者, 逗號分隔, 比對 email 位址的一部分
# 例如: noreply@, newsletter, facebookmail.com
skip_senders =

# 命中這些字的信會被標記起來 (逗號分隔)
highlight_keywords = 作業,考試,期中,期末,停課,補課,調課,繳費,註冊,選課,成績,獎學金,實習,面試,截止,逾期,重要,通知

# 每封信之間停幾秒
request_delay = 0.1

[dashboard]
# ---- 給 Claude 更新 BetterElearning 儀表板用的設定 (這段沒有任何密碼) ----
# 儀表板網址: 第一次設定時 Claude 會自己填
artifact_url =

# 你的系所, 信箱會把系辦 / 系上老師的信分成一組
# dept_label 是按鈕上的字, dept_pattern 是比對寄件者名稱或主旨的正規表示式
dept_label = 系上
dept_pattern = 系辦

# 課號前綴 → 開課單位 (課程分頁顯示用), 格式: 前綴:名稱, 逗號分隔
dept_map = CSIE:資訊工程學系, EE:電機工程學系, GC:通識教育中心, XX:通識教育中心, YY:體育中心

# 這些寄件者當成系統通知/電子報收起來 (逗號分隔, 比對完整 email)
noise_senders =

# 要不要推播通知 (作業 3 天內到期、需注意的新信、同步失敗)
notify = true

# ---- 信件摘要 (選用) ----
# 讓這台電腦用 API、本地模型或 agent 替「需注意」的新信寫摘要和幻燈片短句。
# 要用的話把下面 [summaries] 段落每行開頭的 # 拿掉、填好，再重跑 install_task.ps1 (排程會多一個動作)。
# 金鑰不要寫在這裡：放在環境變數 SUMMARY_API_KEY (或用 api_key_env 指定別的環境變數名稱)。
# 試跑 (只印出結果、不存)：python summaries.py auto --config config.ini --dry-run
#
# provider：openai = OpenAI 相容 API (OpenAI、Gemini、OpenRouter、Ollama、LM Studio…)
#           anthropic = Anthropic API (要 pip install anthropic)
#           command = 任何從 stdin 讀提示詞、把結果印到 stdout 的指令 (例如 codex exec -、claude -p、ollama run <模型>)
# base_url：provider = openai 時填，例如本機 Ollama 是 http://localhost:11434/v1
# model：模型名稱 (provider = command 不用填)
# batch：一次送幾封信，本地小模型可以設 1–3
#
# [summaries]
# provider = openai
# base_url = http://localhost:11434/v1
# model =
# command =
# batch = 5
